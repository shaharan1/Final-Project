<div class="container py-4">

  <div class="card shadow-sm border-0 rounded-4 overflow-hidden">

    <div class="card-header bg-gradient text-white d-flex justify-content-between align-items-center px-4 py-3">
      <h4 class="mb-0 fw-semibold">
        📁 Generic List
      </h4>
      <a
        routerLink="/generics"
        class="btn btn-light btn-sm">
        <i class="bi bi-plus-lg me-1"></i>
        Add Generic
      </a>
    </div>

    <div class="card-body p-0">

      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-success" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading generics...</p>
      </div>

      <div *ngIf="errorMsg" class="alert alert-danger m-4">
        {{ errorMsg }}
      </div>

      <div *ngIf="!loading && !errorMsg && generics.length === 0" class="text-center py-5">
        <i class="bi bi-inbox display-4 text-muted"></i>
        <p class="mt-3 text-muted">No generics found.</p>
      </div>

      <div *ngIf="!loading && generics.length > 0" class="table-responsive">

        <table class="table table-hover align-middle mb-0">

          <thead class="table-light">

            <tr>

              <th class="px-4">#</th>
              <th>Generic Name</th>
              <th class="text-end pe-4">Actions</th>

            </tr>

          </thead>

          <tbody>

            <tr *ngFor="let g of generics; let i = index">

              <td class="px-4">{{ i + 1 }}</td>

              <td class="fw-medium">{{ g.genericName }}</td>

              <td class="text-end pe-4">

                <button
                  class="btn btn-sm btn-outline-warning me-2"
                  (click)="edit(g.id!)">
                  <i class="bi bi-pencil"></i>
                </button>

                <button
                  class="btn btn-sm btn-outline-danger"
                  (click)="delete(g.id!)">
                  <i class="bi bi-trash"></i>
                </button>

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>
