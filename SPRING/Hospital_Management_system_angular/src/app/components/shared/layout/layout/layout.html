<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img src="/assets/elite-care-logo.svg" alt="Elite Care Hospital" class="brand-logo" />
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <span></span><span></span><span></span>
      </button>
    </div>

    <nav class="nav-scroll">
      <div class="nav-group" *ngFor="let group of navGroups">
        <p class="nav-label">{{ group.label }}</p>
        <a *ngFor="let item of group.items"
           [routerLink]="item.route"
           routerLinkActive="active"
           class="nav-item">
          <span class="nav-ic">{{ item.icon }}</span>
          <span class="nav-text">{{ item.label }}</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar">{{ userInitials }}</div>
        <div class="user-info">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">{{ userRole }}</span>
        </div>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open Menu">
        <span></span><span></span><span></span>
      </button>

      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" />
          <path d="M21 21l-4.3-4.3" />
        </svg>
        <input type="text" placeholder="Search patients, doctors, or invoices...">
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Notifications">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.7 21a2 2 0 0 1-3.4 0" />
          </svg>
          <span class="dot"></span>
        </button>

        <button class="icon-btn logout-btn" (click)="logout()" aria-label="Logout">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>

        <div class="topbar-avatar">{{ userInitials }}</div>
      </div>
    </header>

    <div class="content">
      <ng-content></ng-content>
    </div>

    <footer class="footer">
      <p>&copy; {{ currentYear }} Elite Care Hospital. All rights reserved.</p>
    </footer>
  </main>
</div>
