<div class="login-page">
  <div class="login-theme-toggle">
    <app-theme-toggle></app-theme-toggle>
  </div>

  <div class="login-left">
    <div class="login-brand">
      <img src="/assets/elite-care-logo.svg" alt="Elite Care Hospital" class="login-logo" />
    </div>
    <div class="login-features">
      <div class="login-feature">
        <span>👨‍⚕️</span>
        <p>Access your dashboard securely</p>
      </div>
      <div class="login-feature">
        <span>📋</span>
        <p>Manage patients & appointments</p>
      </div>
      <div class="login-feature">
        <span>🔬</span>
        <p>View reports & analytics</p>
      </div>
    </div>
  </div>

  <div class="login-right">
    <div class="login-card">
      <div class="login-card-header">
        <h2>Staff Login</h2>
        <p>Sign in to access your dashboard</p>
      </div>

      <div class="error-msg" *ngIf="errorMessage">
        <span>⚠️</span> {{ errorMessage }}
      </div>

      <form (ngSubmit)="login()">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input
              type="email"
              id="email"
              [(ngModel)]="loginData.email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              [(ngModel)]="loginData.password"
              name="password"
              placeholder="Enter your password"
              required
            />
            <button type="button" class="toggle-pw" (click)="showPassword = !showPassword">
              {{ showPassword ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" [disabled]="loading">
          <span *ngIf="!loading">Sign In</span>
          <span *ngIf="loading">Signing in...</span>
        </button>
      </form>

      <div class="login-footer">
        <a routerLink="/">← Back to Home</a>
      </div>
    </div>
  </div>
</div>
