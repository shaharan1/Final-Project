<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">
                {{ isEdit ? 'Update Doctor' : 'Add Doctor' }}
            </h3>
        </div>

        <div class="card-body">

            <form [formGroup]="doctorForm" (ngSubmit)="save()">

                <div class="row">

                    <!-- Name -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Doctor Name</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="name">
                    </div>

                    <!-- Email -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            formControlName="email">
                    </div>

                    <!-- Phone -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="phone">
                    </div>

                    <!-- Password -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password</label>
                        <input
                            type="password"
                            class="form-control"
                            formControlName="password">
                    </div>

                    <!-- Gender -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Gender</label>

                        <select
                            class="form-select"
                            formControlName="gender">

                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>

                        </select>

                    </div>

                    <!-- Status -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>

                        <select
                            class="form-select"
                            formControlName="status">

                            <option>Active</option>
                            <option>Inactive</option>

                        </select>

                    </div>

                    <!-- Study -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Study</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="study">
                    </div>

                    <!-- Specialization -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Specialization</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="specialization">
                    </div>

                    <!-- Designation -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Designation</label>
                        <input
                            type="text"
                            class="form-control"
                            formControlName="designation">
                    </div>

                    <!-- Registration Number -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Registration Number
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="registrationNumber">
                    </div>

                    <!-- Experience -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Experience (Years)
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            formControlName="experienceYears">
                    </div>

                    <!-- Consultation Fee -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Consultation Fee
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            formControlName="consultationFee">
                    </div>

                    <!-- Follow Up Fee -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Follow Up Fee
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            formControlName="followUpFee">
                    </div>

                    <!-- Available Days -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Available Days
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Sat, Sun, Mon"
                            formControlName="availableDays">
                    </div>

                    <!-- Duty Hours -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Duty Hours
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="9 AM - 2 PM"
                            formControlName="dutyHours">
                    </div>

                    <!-- Chamber -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Chamber
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            formControlName="chamber">
                    </div>

                    <!-- Join Date -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Join Date
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            formControlName="joinDate">
                    </div>

                    <!-- Photo -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Doctor Photo
                        </label>
                        <div class="text-center">
                            <div class="position-relative d-inline-block">
                                <img *ngIf="hasPhoto(); else defaultAvatar"
                                     [src]="getPhotoPreview() | imageUrl"
                                     class="rounded-circle border border-3 border-white shadow-sm uploaded-photo"
                                     alt="Doctor Photo">
                                <ng-template #defaultAvatar>
                                    <div class="default-avatar d-flex align-items-center justify-content-center rounded-circle border border-3 border-white shadow-sm">
                                        <svg width="80" height="80" viewBox="0 0 100 100" fill="none" stroke="#adb5bd" stroke-width="2">
                                            <circle cx="50" cy="35" r="25"/>
                                            <path d="M30 85 C30 60 70 60 70 85"/>
                                        </svg>
                                    </div>
                                </ng-template>
                            </div>
                            <input type="file" accept="image/jpeg,image/jpg,image/png,image/webp"
                                   (change)="onFileSelected($event)" hidden #fileInput>
                            <div class="d-flex gap-2 justify-content-center mt-2 flex-wrap">
                                <button type="button" class="btn btn-sm btn-outline-primary" (click)="fileInput.click()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    Choose Photo
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-danger" *ngIf="previewUrl" (click)="removePhoto()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                                    Remove
                                </button>
                            </div>
                            <div class="mt-1">
                                <small class="text-muted" *ngIf="photoFile">{{ photoFile.name }} ({{ (photoFile.size / 1024 | number:'1.0-0') }} KB)</small>
                            </div>
                            <div class="text-danger small mt-1" *ngIf="photoSizeError">{{ photoSizeError }}</div>
                            <div class="text-muted small mt-1">JPG, PNG or WebP. Max 2 MB.</div>
                        </div>
                    </div>

                    <!-- Department -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <select
                            class="form-select"
                            formControlName="doctorDepatrmentId">

                            <option value="">
                                Select Department
                            </option>

                            <option
                                *ngFor="let dep of departments"
                                [value]="dep.id">

                                {{ dep.departmentName }}

                            </option>

                        </select>

                    </div>

                </div>

                <div class="text-center mt-3">

                    <button
                        class="btn btn-success px-5"
                        type="submit">

                        {{ isEdit ? 'Update Doctor' : 'Save Doctor' }}

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
