<div class="container mt-4">

<div class="card shadow">

<div class="test-header">

<svg class="test-header-heartbeat" viewBox="0 0 1200 120" preserveAspectRatio="none">
  <path d="M0,60 L150,60 L180,20 L210,100 L240,10 L270,110 L300,40 L330,80 L360,60 L600,60 L630,20 L660,100 L690,10 L720,110 L750,40 L780,80 L810,60 L1050,60 L1080,20 L1110,100 L1140,10 L1170,110 L1200,60" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" class="wave-path"/>
</svg>

<div class="test-icon">📋</div>
<h4>Test List</h4>

<a
  routerLink="/tests/create"
  class="btn btn-light">

  Add Test

</a>

</div>

<div class="card-body">

<input
class="form-control mb-3"
placeholder="Search Test"
[(ngModel)]="keyword"
(keyup)="search()">

<table class="table table-bordered">

<thead>

<tr>

<th>Code</th>
<th>Name</th>
<th>Price</th>
<th>Range</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody>

<tr *ngFor="let t of tests">

<td>{{t.testCode}}</td>

<td>{{t.testName}}</td>

<td>{{t.standardPrice}}</td>

<td>{{t.normalRange}}</td>

<td>

<span
class="badge bg-success"
*ngIf="t.active">

Active

</span>

<span
class="badge bg-danger"
*ngIf="!t.active">

Inactive

</span>

</td>

<td>

<button
class="btn btn-warning btn-sm me-2"
(click)="edit(t.id!)">

Edit

</button>

<button
class="btn btn-danger btn-sm"
(click)="delete(t.id!)">

Delete

</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>
