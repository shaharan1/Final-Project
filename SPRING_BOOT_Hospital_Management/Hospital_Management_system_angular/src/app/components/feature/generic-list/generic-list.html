<div class="container mt-4">

  <div class="card shadow">

    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
      <h4>Generic List</h4>
      <button class="btn btn-light btn-sm" routerLink="/generics/create">
        <i class="bi bi-plus-circle me-1"></i> Add Generic
      </button>
    </div>

    <div class="card-body">

      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading generics...</p>
      </div>

      <div *ngIf="errorMsg" class="alert alert-danger">
        {{ errorMsg }}
      </div>

      <div *ngIf="!loading && !errorMsg">
        <input
          class="form-control mb-3"
          placeholder="Search Generic"
          [(ngModel)]="keyword"
          (keyup)="search()">
      </div>

      <table class="table table-bordered table-hover">

        <thead>

          <tr>

            <th>#</th>
            <th>Generic Name</th>
            <th width="180">Action</th>

          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let g of generics; let i = index">

            <td>{{ i + 1 }}</td>

            <td>{{ g.genericName }}</td>

            <td>

              <button
                class="btn btn-warning btn-sm me-2"
                (click)="edit(g.id!)">

                Update

              </button>

              <button
                class="btn btn-danger btn-sm"
                (click)="delete(g.id!)">

                Delete

              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
