<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
  <h4 class="mb-0 fw-bold">Test List</h4>
  <button class="btn btn-light btn-sm" routerLink="/tests/create">
    <i class="bi bi-plus-circle me-1"></i> Add Test
  </button>
</div>

<div class="card-body">

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3 text-muted">Loading tests...</p>
  </div>

  <div *ngIf="errorMsg" class="alert alert-danger">
    {{ errorMsg }}
  </div>

  <div *ngIf="!loading && !errorMsg">
    <input
      class="form-control mb-3"
      placeholder="Search Test"
      [(ngModel)]="keyword"
      (keyup)="search()">
  </div>

  <table class="table table-bordered">

    <thead>

    <tr>

      <th>Code</th>
      <th>Name</th>
      <th>Price</th>
      <th>Range</th>
      <th>Status</th>
      <th>Action</th>

    </tr>

    </thead>

    <tbody>

    <tr *ngFor="let t of tests">

      <td>{{t.testCode}}</td>

      <td>{{t.testName}}</td>

      <td>{{t.standardPrice}}</td>

      <td>{{t.normalRange}}</td>

      <td>

        <span
        class="badge bg-success"
        *ngIf="t.active">

        Active

        </span>

        <span
        class="badge bg-danger"
        *ngIf="!t.active">

        Inactive

        </span>

      </td>

      <td>

        <button
        class="btn btn-warning btn-sm me-2"
        (click)="edit(t.id!)">

        Edit

        </button>

        <button
        class="btn btn-danger btn-sm"
        (click)="delete(t.id!)">

        Delete

        </button>

      </td>

    </tr>

    </tbody>

    </table>

</div>

</div>

</div>
