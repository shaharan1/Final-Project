<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="220" rx="16" fill="#F5F1EA"/>

  <!-- ELITE text with cross -->
  <text x="60" y="95" font-family="Inter, sans-serif" font-size="52" font-weight="700" fill="#8B3A33" letter-spacing="8">ELI</text>

  <!-- Cross (replacing T) -->
  <rect x="218" y="62" width="8" height="46" rx="2" fill="#8B3A33"/>
  <rect x="200" y="78" width="44" height="8" rx="2" fill="#8B3A33"/>

  <!-- E after cross -->
  <text x="260" y="95" font-family="Inter, sans-serif" font-size="52" font-weight="700" fill="#8B3A33">E</text>

  <!-- Heartbeat line -->
  <polyline points="310,82 330,82 340,50 355,110 370,65 385,95 395,82 420,82"
    fill="none" stroke="#8B3A33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CARE text -->
  <text x="435" y="95" font-family="Inter, sans-serif" font-size="52" font-weight="700" fill="#8B3A33" letter-spacing="4">CARE</text>

  <!-- HOSPITAL badge -->
  <rect x="195" y="115" width="210" height="48" rx="24" fill="#8B3A33"/>
  <text x="300" y="145" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">HOSPITAL</text>

  <!-- Tagline -->
  <text x="300" y="195" font-family="Inter, sans-serif" font-size="16" font-style="italic" fill="#8FB3A9" text-anchor="middle">Caring for every moment...</text>
</svg>
