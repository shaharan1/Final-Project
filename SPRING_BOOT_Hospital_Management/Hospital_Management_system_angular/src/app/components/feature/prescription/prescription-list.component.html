<div class="container-fluid py-4">

  <div class="card shadow-lg border-0 rounded-4 mb-4">

    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">

      <h4 class="mb-0 fw-bold">
        My Prescriptions
      </h4>

      <button class="btn btn-light btn-sm" (click)="router.navigate(['/prescriptions/create/0'])">
        <i class="bi bi-plus-circle me-1"></i>
        New Prescription
      </button>

    </div>

    <div class="card-body">

      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading prescriptions...</p>
      </div>

      <div *ngIf="errorMsg" class="alert alert-danger">
        {{ errorMsg }}
      </div>

      <div *ngIf="!loading && !errorMsg && prescriptions.length === 0" class="text-center py-5">
        <i class="bi bi-prescription display-4 text-muted"></i>
        <p class="mt-3 text-muted">No prescriptions found.</p>
      </div>

      <div *ngIf="!loading && prescriptions.length > 0" class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-light">

            <tr>

              <th>#</th>

              <th>Prescription No.</th>

              <th>Patient</th>

              <th>Diagnosis</th>

              <th>Date</th>

              <th class="text-end">Actions</th>

            </tr>

          </thead>

          <tbody>

            <tr *ngFor="let p of prescriptions; let i = index">

              <td>{{ i + 1 }}</td>

              <td>{{ p.prescriptionNumber || 'N/A' }}</td>

              <td>{{ p.patientName || 'N/A' }}</td>

              <td>
                <span class="text-truncate d-inline-block" style="max-width: 200px;" [title]="p.diagnosis">
                  {{ p.diagnosis || 'N/A' }}
                </span>
              </td>

              <td>{{ formatDate(p.createdDate) }}</td>

              <td class="text-end">

                <button class="btn btn-outline-primary btn-sm me-1"
                  (click)="editPrescription(p.id!)"
                  title="Edit Prescription">
                  <i class="bi bi-pencil"></i> Edit
                </button>

                <button class="btn btn-outline-secondary btn-sm"
                  (click)="viewPdf(p.id!)"
                  title="View / Print PDF">
                  <i class="bi bi-printer"></i> Print
                </button>

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>
