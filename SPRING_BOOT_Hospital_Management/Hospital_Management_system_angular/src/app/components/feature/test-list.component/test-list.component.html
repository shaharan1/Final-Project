<div class="container py-4">

  <div class="card shadow-sm border-0 rounded-4 overflow-hidden">

    <div class="card-header bg-gradient text-white d-flex justify-content-between align-items-center px-4 py-3 position-relative">

      <svg class="position-absolute start-0 top-0 w-100 h-100" viewBox="0 0 1200 120" preserveAspectRatio="none" style="z-index: 1;">
        <path d="M0,60 L150,60 L180,20 L210,100 L240,10 L270,110 L300,40 L330,80 L360,60 L600,60 L630,20 L660,100 L690,10 L720,110 L750,40 L780,80 L810,60 L1050,60 L1080,20 L1110,100 L1140,10 L1170,110 L1200,60" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
      </svg>

      <div class="position-relative" style="z-index: 2;">
        <h4 class="mb-0 fw-semibold">🧪 Test List</h4>
      </div>

      <a
        routerLink="/tests/create"
        class="btn btn-light btn-sm position-relative"
        style="z-index: 2;">
        <i class="bi bi-plus-lg me-1"></i>
        Add Test
      </a>

    </div>

    <div class="card-body p-0">

      <div class="p-4">

        <input
          class="form-control border-2 rounded-3 mb-0"
          placeholder="🔍 Search Test"
          [(ngModel)]="keyword"
          (keyup)="search()">

      </div>

      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading tests...</p>
      </div>

      <div *ngIf="errorMsg" class="alert alert-danger m-4">
        {{ errorMsg }}
      </div>

      <div *ngIf="!loading && !errorMsg && tests.length === 0" class="text-center py-5">
        <i class="bi bi-inbox display-4 text-muted"></i>
        <p class="mt-3 text-muted">No tests found.</p>
      </div>

      <div *ngIf="!loading && tests.length > 0" class="table-responsive">

        <table class="table table-hover align-middle mb-0">

          <thead class="table-light">

            <tr>

              <th class="px-4">Code</th>
              <th>Name</th>
              <th>Price</th>
              <th>Range</th>
              <th>Status</th>
              <th class="text-end pe-4">Actions</th>

            </tr>

          </thead>

          <tbody>

            <tr *ngFor="let t of tests">

              <td class="px-4 fw-medium">{{t.testCode}}</td>

              <td>{{t.testName}}</td>

              <td>৳{{t.standardPrice}}</td>

              <td>
                <span class="text-truncate d-inline-block" style="max-width: 180px;" [title]="t.normalRange">
                  {{t.normalRange}}
                </span>
              </td>

              <td>

                <span
                  class="badge bg-success"
                  *ngIf="t.active">
                  Active
                </span>

                <span
                  class="badge bg-secondary"
                  *ngIf="!t.active">
                  Inactive
                </span>

              </td>

              <td class="text-end pe-4">

                <button
                  class="btn btn-sm btn-outline-warning me-2"
                  (click)="edit(t.id!)">
                  <i class="bi bi-pencil"></i>
                </button>

                <button
                  class="btn btn-sm btn-outline-danger"
                  (click)="delete(t.id!)">
                  <i class="bi bi-trash"></i>
                </button>

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>
